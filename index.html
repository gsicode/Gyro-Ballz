<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Gyro Ballz</title>
  <style>
    :root {
      --bg-1: #090d12;
      --bg-2: #111827;
      --panel: rgba(255,255,255,0.06);
      --panel-border: rgba(255,255,255,0.12);
      --silver-1: #f4f8ff;
      --silver-2: #dfe7f1;
      --silver-3: #a8b7c9;
      --silver-4: #7a8798;
      --dip: rgba(255,255,255,0.05);
      --dip-ring: rgba(255,255,255,0.16);
      --text: rgba(255,255,255,0.9);
      --subtle: rgba(255,255,255,0.74);
      --shadow: rgba(0,0,0,0.4);
      --success: #d9f9e3;
      --success-strong: #8ef0b2;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,0.08), transparent 20%),
                  radial-gradient(circle at 80% 75%, rgba(255,255,255,0.05), transparent 20%),
                  linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    #fireworksCanvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 58px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 170px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 10px 28px rgba(0,0,0,0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      letter-spacing: 0.08em;
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 700;
      text-transform: uppercase;
    }

    #quitButton {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 11;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      font-size: 24px;
      line-height: 1;
      letter-spacing: 0;
      text-transform: none;
    }

    #quitButton[hidden] {
      display: none;
    }

    .hud-item {
      display: inline-block;
      min-width: 70px;
      text-align: center;
    }

    .hud-divider {
      opacity: 0.5;
    }

    @media (max-width: 360px) {
      #hud {
        left: 56px;
        right: 10px;
        min-width: 0;
        gap: 4px;
        padding: 6px 8px;
        justify-content: space-between;
        font-size: 11px;
      }

      .hud-item {
        min-width: 0;
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 12, 0.48);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .panel {
      width: min(88vw, 540px);
      padding: 28px 22px 20px;
      border-radius: 28px;
      background: rgba(15, 19, 25, 0.82);
      border: 1px solid var(--panel-border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.42);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 10px 0 14px;
      color: var(--subtle);
      line-height: 1.5;
      font-size: clamp(14px, 2vw, 18px);
    }

    .rows {
      display: grid;
      gap: 14px;
      margin: 16px 0 22px;
      text-align: left;
    }

    .setting {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
    }

    .value {
      font-weight: 800;
      color: white;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #dfeaf8;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #dfeaf8;
    }

    select {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(12,16,20,0.9);
      color: white;
      padding: 10px 12px;
      font-size: 16px;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 24px;
      color: #111827;
      background: linear-gradient(180deg, #f3f7ff, #dce9ff);
      box-shadow: 0 12px 26px rgba(255,255,255,0.18);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 800;
      font-size: clamp(13px, 2vw, 18px);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 8px 18px rgba(255,255,255,0.1);
    }

    #winOverlay {
      display: none;
    }

    #winOverlay.visible {
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    }

    .win-box {
      width: min(74vw, 420px);
      margin-block: auto;
      flex-shrink: 0;
      padding: 28px 22px 20px;
      border-radius: 28px;
      background: rgba(15, 19, 25, 0.88);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 22px 54px rgba(0,0,0,0.45);
      text-align: center;
    }

    .win-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .win-box h2 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .win-box p {
      margin: 0 0 18px;
      font-size: clamp(15px, 2vw, 20px);
    }

    .timer {
      margin: 10px 0 20px;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.08em;
      color: #dfeaf8;
    }

    .leaderboard {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
      text-align: left;
    }

    .leaderboard h3 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }

    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
      color: rgba(255,255,255,0.88);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    @media (max-width: 420px) {
      .leaderboard-item {
        grid-template-columns: 22px minmax(0, 1fr);
      }

      .leaderboard-time {
        grid-column: 2;
        text-align: left;
      }
    }

    @keyframes recentPulse {
      0% {
        border-color: rgba(125, 211, 252, 0.85);
        box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.14), 0 0 10px rgba(125, 211, 252, 0.2);
      }
      50% {
        border-color: rgba(147, 197, 253, 1);
        box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.24), 0 0 18px rgba(125, 211, 252, 0.46), 0 0 28px rgba(96, 165, 250, 0.24);
      }
      100% {
        border-color: rgba(125, 211, 252, 0.9);
        box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.18), 0 0 12px rgba(125, 211, 252, 0.3);
      }
    }

    .leaderboard-item--recent {
      border: 1px solid rgba(125, 211, 252, 0.95);
      box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.18), 0 0 12px rgba(125, 211, 252, 0.24);
      background: rgba(125, 211, 252, 0.06);
      animation: recentPulse 1.6s ease-in-out infinite alternate;
    }

    .leaderboard-rank {
      font-weight: 800;
      opacity: 0.8;
    }

    .leaderboard-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .leaderboard-time {
      display: grid;
      gap: 2px;
      font-weight: 700;
      color: #dfeaf8;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .leaderboard-time-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .leaderboard-time-label {
      color: var(--subtle);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .penalty-popup {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      color: #ffe08a;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      animation: penaltyFloat 0.9s ease-out forwards;
    }

    @keyframes penaltyFloat {
      from { opacity: 1; translate: 0 0; }
      to { opacity: 0; translate: 0 -34px; }
    }
  </style>
</head>
<body>
  <div id="game">
    <button id="quitButton" type="button" aria-label="Quit to main menu" title="Quit to main menu" hidden>&lt;</button>
    <div id="hud">
      <span id="scoreText" class="hud-item">0 / 5</span>
      <span class="hud-divider">|</span>
      <span id="timerText" class="hud-item">0.000s</span>
      <span class="hud-divider">|</span>
      <span id="penaltyText" class="hud-item">0 pen +0s</span>
    </div>

    <canvas id="canvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1>Gyro Ballz</h1>
        <div id="startMenuContent">
          <div class="rows">
            <div class="setting">
              <div class="label-row">
                <span>Difficulty</span>
                <span id="sizeValue" class="value">Normal</span>
              </div>
              <input id="sizeSlider" type="range" min="0.7" max="1.6" step="0.05" value="1.0" />
            </div>

            <div class="setting">
              <div class="label-row">
                <span>Balls & Dips</span>
                <span id="countValue" class="value">5</span>
              </div>
              <input id="countSlider" type="range" min="5" max="10" step="1" value="5" />
            </div>

            <div class="setting">
              <div class="label-row">
                <label for="penaltiesEnabled">Hit penalties</label>
                <input id="penaltiesEnabled" type="checkbox" />
              </div>
              <label class="label-row" for="penaltyType">Penalize</label>
              <select id="penaltyType" disabled>
                <option value="dip">Ball in a dip</option>
                <option value="wall">Outer wall</option>
                <option value="both">Both</option>
              </select>
            </div>
          </div>

          <p class="notice">Any dip works. One ball can only sit in each dip at a time.</p>
          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button id="randomizeButton" type="button">Randomise</button>
            <button id="startButton">Start game</button>
            <button id="showLeaderboardButton" type="button">Leaderboard</button>
          </div>
        </div>

        <div id="menuLeaderboardView" hidden>
          <h2>Leaderboard</h2>
          <div class="leaderboard">
            <ol id="menuLeaderboardList" class="leaderboard-list"></ol>
          </div>
          <button id="leaderboardBackButton" type="button">Back</button>
        </div>
      </div>
    </div>

    <div id="winOverlay" class="overlay">
      <div class="win-box">
        <h2>You win!</h2>
        <p>All balls are in their dips.</p>
        <div class="timer" id="timerDisplay">0.000s</div>

        <div class="leaderboard">
          <h3>Leaderboard</h3>
          <ol id="leaderboardList" class="leaderboard-list"></ol>
        </div>

        <div class="win-actions">
          <button id="restartButton">Play again</button>
          <button id="menuButton" type="button">Main menu</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fireworksCanvas = document.getElementById('fireworksCanvas');
    const fireworksCtx = fireworksCanvas.getContext('2d');
    const hud = document.getElementById('hud');
    const quitButton = document.getElementById('quitButton');
    const scoreText = document.getElementById('scoreText');
    const timerText = document.getElementById('timerText');
    const penaltyText = document.getElementById('penaltyText');
    const startOverlay = document.getElementById('startOverlay');
    const winOverlay = document.getElementById('winOverlay');
    const startButton = document.getElementById('startButton');
    const randomizeButton = document.getElementById('randomizeButton');
    const restartButton = document.getElementById('restartButton');
    const menuButton = document.getElementById('menuButton');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const countSlider = document.getElementById('countSlider');
    const countValue = document.getElementById('countValue');
    const penaltiesEnabled = document.getElementById('penaltiesEnabled');
    const penaltyType = document.getElementById('penaltyType');
    const timerDisplay = document.getElementById('timerDisplay');
    const leaderboardList = document.getElementById('leaderboardList');
    const menuLeaderboardList = document.getElementById('menuLeaderboardList');
    const startMenuContent = document.getElementById('startMenuContent');
    const menuLeaderboardView = document.getElementById('menuLeaderboardView');
    const showLeaderboardButton = document.getElementById('showLeaderboardButton');
    const leaderboardBackButton = document.getElementById('leaderboardBackButton');

    const LEADERBOARD_KEY = 'gyro-ballz-leaderboard-v1';
    const PENALTY_COOLDOWN_MS = 1000;

    let BALL_COUNT = 5;
    let DIP_COUNT = 5;
    let sizeScale = 1;
    const gravity = 420;

    let w = 0;
    let h = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    let tiltX = 0;
    let tiltY = 0;
    let motionReady = false;
    const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
    let motionSupported = isMobileDevice && typeof window.DeviceOrientationEvent !== 'undefined';
    let keyboardTiltX = 0;
    let keyboardTiltY = 0;
    let running = false;
    let win = false;
    let lastTs = 0;
    let audioCtx = null;
    let gameStartTime = 0;
    let winTime = 0;
    let penaltyCount = 0;
    let penaltyAddedTime = 0;
    let lastPenaltyAt = -Infinity;

    let dips = [];
    let balls = [];
    let fireworks = [];

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      fireworksCanvas.width = Math.floor(w * dpr);
      fireworksCanvas.height = Math.floor(h * dpr);
      fireworksCanvas.style.width = w + 'px';
      fireworksCanvas.style.height = h + 'px';
      fireworksCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function getTableRect() {
      const width = Math.min(w * 0.9, 980);
      const height = Math.min(h * 0.76, 720);
      const x = (w - width) / 2;
      const y = (h - height) * 0.58;
      return { x, y, width, height, right: x + width, bottom: y + height };
    }

    function updateSizeLabel() {
      const val = Number(sizeSlider.value);
      if (val < 0.9) sizeValue.textContent = 'Small';
      else if (val > 1.1) sizeValue.textContent = 'Large';
      else sizeValue.textContent = 'Normal';
      sizeScale = val;
    }

    function updateCountLabel() {
      const val = Number(countSlider.value);
      countValue.textContent = val;
    }

    function randomizeSettings() {
      const randomBallCount = Math.floor(randomBetween(5, 11));
      const randomSize = Number(randomBetween(0.7, 1.6).toFixed(2));

      sizeSlider.value = String(randomSize);
      countSlider.value = String(randomBallCount);
      updateSizeLabel();
      updateCountLabel();
    }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainValue = 0.05) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = gainValue;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      const stopAt = audioCtx.currentTime + duration;
      gain.gain.exponentialRampToValueAtTime(0.0001, stopAt);
      osc.stop(stopAt);
    }

    function vibrate(ms) {
      if ('vibrate' in navigator) {
        navigator.vibrate(ms);
      }
    }

    function updateHud() {
      const secured = balls.filter(b => b.captured).length;
      scoreText.textContent = secured + ' / ' + BALL_COUNT;
      const totalSeconds = running || win ? getElapsedTime() : 0;
      timerText.textContent = totalSeconds.toFixed(3) + 's';
      penaltyText.textContent = `${penaltyCount} pen +${penaltyAddedTime}s`;
    }

    function getElapsedTime() {
      const runTime = win ? winTime : (Date.now() - gameStartTime) / 1000;
      return runTime + penaltyAddedTime;
    }

    function getSizeLabel(value = Number(sizeSlider.value)) {
      if (value < 0.9) return 'Small';
      if (value > 1.1) return 'Large';
      return 'Normal';
    }

    function getLeaderboard() {
      try {
        const raw = localStorage.getItem(LEADERBOARD_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function saveLeaderboardEntry(entry) {
      const entries = getLeaderboard().map(item => ({ ...item, recent: false }));
      const next = [...entries, { ...entry, recent: true }]
        .sort((a, b) => a.time - b.time || b.balls - a.balls)
        .slice(0, 5);

      try {
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(next));
      } catch (err) {
        console.warn('Leaderboard save failed:', err);
      }
    }

    function renderLeaderboard() {
      const entries = getLeaderboard();
      for (const list of [leaderboardList, menuLeaderboardList]) {
        list.innerHTML = '';

        if (!entries.length) {
          const empty = document.createElement('li');
          empty.className = 'leaderboard-item';
          empty.innerHTML = '<span class="leaderboard-rank">-</span><span class="leaderboard-meta"><span>No runs yet</span></span><span class="leaderboard-time">-</span>';
          list.appendChild(empty);
          continue;
        }

        entries.forEach((entry, index) => {
          const penalties = entry.penalties ?? 0;
          const addedTime = entry.addedTime ?? 0;
          const item = document.createElement('li');
          const isRecent = !!entry.recent;
          item.className = 'leaderboard-item' + (isRecent ? ' leaderboard-item--recent' : '');
          item.innerHTML = `
            <span class="leaderboard-rank">${index + 1}</span>
            <span class="leaderboard-meta">
              <span>${entry.balls} balls</span>
              <span>•</span>
              <span>${entry.size}</span>
              <span>•</span>
              <span>${penalties} pen (+${addedTime.toFixed(0)}s)</span>
            </span>
            <span class="leaderboard-time">
              <span class="leaderboard-time-line"><span class="leaderboard-time-label">Actual</span><span>${entry.time.toFixed(3)}s</span></span>
              <span class="leaderboard-time-line"><span class="leaderboard-time-label">With pen</span><span>${(entry.time + addedTime).toFixed(3)}s</span></span>
            </span>
          `;
          list.appendChild(item);
        });
      }
    }

    function createDip(x, y, radius) {
      return { x, y, radius, glow: 0, occupiedBy: null };
    }

    function generateDips() {
      const table = getTableRect();
      const safeMargin = 52;
      const minDist = 110;
      const result = [];

      for (let i = 0; i < DIP_COUNT; i++) {
        let placed = false;
        for (let tries = 0; tries < 3000; tries++) {
          const radius = randomBetween(32, 52) * sizeScale;
          const x = randomBetween(table.x + safeMargin + radius, table.right - safeMargin - radius);
          const y = randomBetween(table.y + safeMargin + radius, table.bottom - safeMargin - radius);

          const overlaps = result.some(d => {
            const dist = Math.hypot(d.x - x, d.y - y);
            return dist < Math.max(minDist, d.radius + radius + 8);
          });

          if (!overlaps) {
            result.push(createDip(x, y, radius));
            placed = true;
            break;
          }
        }

        if (!placed) {
          const angle = (Math.PI * 2 * i) / Math.max(DIP_COUNT, 1);
          const orbitX = (table.width * 0.24);
          const orbitY = (table.height * 0.2);
          const x = table.x + table.width / 2 + Math.cos(angle) * orbitX;
          const y = table.y + table.height / 2 + Math.sin(angle) * orbitY;
          result.push(createDip(x, y, 46 * sizeScale));
        }
      }

      return result;
    }

    function generateBalls() {
      const table = getTableRect();
      const spreadX = table.width * 0.24;
      const spreadY = table.height * 0.22;
      const radius = 18 * sizeScale;

      return Array.from({ length: BALL_COUNT }, (_, i) => {
        const angle = (Math.PI * 2 * i) / Math.max(BALL_COUNT, 1);
        const x = table.x + table.width / 2 + (Math.random() - 0.5) * spreadX * 1.6 + Math.cos(angle) * spreadX * 0.6;
        const y = table.y + table.height / 2 + (Math.random() - 0.5) * spreadY * 1.4 + Math.sin(angle) * spreadY * 0.6;

        return {
          x: clamp(x, table.x + radius, table.right - radius),
          y: clamp(y, table.y + radius, table.bottom - radius),
          vx: randomBetween(-120, 120),
          vy: randomBetween(-120, 120),
          radius,
          captured: false,
          capturedDip: null,
          glow: 0,
          color: i % 2 === 0 ? '#e7edf6' : '#c1ced9'
        };
      });
    }

    function resetGame() {
      const count = Number(countSlider.value);
      BALL_COUNT = count;
      DIP_COUNT = count;
      sizeScale = Number(sizeSlider.value);
      updateSizeLabel();

      dips = generateDips();
      balls = generateBalls();
      fireworks = [];
      win = false;
      penaltyCount = 0;
      penaltyAddedTime = 0;
      lastPenaltyAt = -Infinity;
      winOverlay.classList.remove('visible');
      lastTs = 0;
      gameStartTime = Date.now();
      winTime = 0;
      updateHud();
    }

    function releaseBall(ball) {
      if (ball.captured) {
        ball.captured = false;
        if (ball.capturedDip) {
          ball.capturedDip.occupiedBy = null;
        }
        ball.capturedDip = null;
        ball.vx = (Math.random() - 0.5) * 80;
        ball.vy = (Math.random() - 0.5) * 80;
      }
    }

    function recordPenalty(type, x, y) {
      if (!running || !penaltiesEnabled.checked) return;
      if (type === 'dip' && !['dip', 'both'].includes(penaltyType.value)) return;
      if (type === 'wall' && !['wall', 'both'].includes(penaltyType.value)) return;
      const now = performance.now();
      if (now - lastPenaltyAt < PENALTY_COOLDOWN_MS) return;
      lastPenaltyAt = now;

      penaltyCount++;
      penaltyAddedTime += 5;

      const popup = document.createElement('div');
      popup.className = 'penalty-popup';
      popup.textContent = '+5';
      popup.style.left = clamp(x, 22, w - 22) + 'px';
      popup.style.top = clamp(y, 22, h - 22) + 'px';
      document.getElementById('game').appendChild(popup);
      window.setTimeout(() => popup.remove(), 900);
      updateHud();
    }

    function spawnFireworks() {
      const centerX = w / 2;
      const centerY = h / 2;
      const burst = 48;
      
      for (let i = 0; i < burst; i++) {
        const angle = (Math.PI * 2 * i) / burst + (Math.random() - 0.5) * 0.3;
        const speed = randomBetween(120, 340);
        const colors = ['#ffff00', '#ff6b6b', '#4ecdc4', '#95e1d3', '#f38181', '#aa96da', '#fcbad3', '#ffffd2'];
        
        fireworks.push({
          x: centerX,
          y: centerY,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: randomBetween(1.2, 2.0),
          age: 0,
          size: randomBetween(3, 8),
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      
      playTone(540, 0.14, 'triangle', 0.05);
      playTone(860, 0.16, 'sine', 0.05);
    }

    function tryCapture(ball) {
      if (ball.captured) {
        return;
      }

      const dip = dips.find(d => {
        if (d.occupiedBy && d.occupiedBy !== ball) return false;
        const dx = ball.x - d.x;
        const dy = ball.y - d.y;
        const dist = Math.hypot(dx, dy);
        return dist < d.radius * 0.68;
      });

      if (!dip) return;

      const speed = Math.hypot(ball.vx, ball.vy);
      const force = Math.abs(tiltX) + Math.abs(tiltY);

      if (speed < 160 && force < 1.3) {
        ball.captured = true;
        ball.capturedDip = dip;
        dip.occupiedBy = ball;
        ball.x = dip.x;
        ball.y = dip.y;
        ball.vx = 0;
        ball.vy = 0;
        ball.glow = 1;
        playTone(220, 0.12, 'triangle', 0.05);
        playTone(400, 0.08, 'sine', 0.04);
        vibrate(55);
        updateHud();
      }
    }

    function updatePhysics(ball, dt) {
      const table = getTableRect();
      const left = table.x + ball.radius;
      const right = table.right - ball.radius;
      const top = table.y + ball.radius;
      const bottom = table.bottom - ball.radius;

      if (ball.captured && ball.capturedDip) {
        const dip = ball.capturedDip;
        const dist = Math.hypot(ball.x - dip.x, ball.y - dip.y);
        const force = Math.abs(tiltX) + Math.abs(tiltY);
        const speed = Math.hypot(ball.vx, ball.vy);

        if (force > 1.6 || speed > 160 || dist > dip.radius * 0.82) {
          releaseBall(ball);
        } else {
          ball.x += (dip.x - ball.x) * 0.16;
          ball.y += (dip.y - ball.y) * 0.16;
          ball.vx *= 0.78;
          ball.vy *= 0.78;
          ball.glow *= 0.96;
          return;
        }
      }

      const acceleration = motionReady
        ? getGyroAcceleration(dt)
        : getDesktopAcceleration(dt);

      ball.vx += acceleration.x;
      ball.vy += acceleration.y;
      ball.vx *= 0.994;
      ball.vy *= 0.994;

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      let wallImpact = null;
      if (ball.x <= left) {
        ball.x = left;
        ball.vx *= -0.7;
        vibrate(12);
        wallImpact = { x: table.x, y: ball.y };
      }
      if (ball.x >= right) {
        ball.x = right;
        ball.vx *= -0.7;
        vibrate(12);
        wallImpact = { x: table.right, y: ball.y };
      }
      if (ball.y <= top) {
        ball.y = top;
        ball.vy *= -0.7;
        vibrate(12);
        wallImpact = { x: ball.x, y: table.y };
      }
      if (ball.y >= bottom) {
        ball.y = bottom;
        ball.vy *= -0.7;
        vibrate(12);
        wallImpact = { x: ball.x, y: table.bottom };
      }
      if (wallImpact) {
        recordPenalty('wall', wallImpact.x, wallImpact.y);
      }

      for (let i = 0; i < balls.length; i++) {
        const other = balls[i];
        if (other === ball) continue;

        const dx = other.x - ball.x;
        const dy = other.y - ball.y;
        const distSq = dx * dx + dy * dy;
        const minDist = ball.radius + other.radius + 2;

        if (distSq > 0 && distSq < minDist * minDist) {
          const dist = Math.sqrt(distSq) || 0.0001;
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = (minDist - dist) * 0.5;

          ball.x -= nx * overlap;
          ball.y -= ny * overlap;
          other.x += nx * overlap;
          other.y += ny * overlap;

          const rvx = other.vx - ball.vx;
          const rvy = other.vy - ball.vy;
          const velAlongNormal = rvx * nx + rvy * ny;

          if (velAlongNormal < 0) {
            const impulse = -velAlongNormal * 0.75;
            ball.vx -= impulse * nx;
            ball.vy -= impulse * ny;
            other.vx += impulse * nx;
            other.vy += impulse * ny;
          }

          if (ball.captured || other.captured) {
            recordPenalty('dip', (ball.x + other.x) / 2, (ball.y + other.y) / 2);
            releaseBall(ball);
            releaseBall(other);
          } else {
            vibrate(15);
          }
        }
      }

      ball.glow *= 0.97;
      tryCapture(ball);
    }

    function getDesktopAcceleration(dt) {
      return {
        x: tiltX * gravity * dt,
        y: tiltY * gravity * dt
      };
    }

    function getGyroAcceleration(dt) {
      const radiansPerDegree = Math.PI / 180;
      const angleX = tiltX * 28 * radiansPerDegree;
      const angleY = tiltY * 28 * radiansPerDegree;
      return {
        x: Math.sin(angleX) * gravity * dt,
        y: Math.sin(angleY) * gravity * dt
      };
    }

    function updateFireworks(dt) {
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.age += dt;
        f.x += f.dx * dt;
        f.y += f.dy * dt;
        f.dy += 140 * dt;
        if (f.age >= f.life) {
          fireworks.splice(i, 1);
        }
      }
    }

    function update(dt) {
      if (running) {
        for (const ball of balls) {
          updatePhysics(ball, dt);
        }
        updateHud();

        const secured = balls.filter(b => b.captured).length;
        if (secured >= BALL_COUNT && BALL_COUNT > 0) {
          win = true;
          running = false;
          winTime = (Date.now() - gameStartTime) / 1000;
          timerDisplay.textContent = winTime.toFixed(3) + 's';
          saveLeaderboardEntry({
            time: winTime,
            balls: BALL_COUNT,
            size: getSizeLabel(),
            penalties: penaltyCount,
            addedTime: penaltyAddedTime
          });
          renderLeaderboard();
          updateHud();
          spawnFireworks();
          winOverlay.classList.add('visible');
          playTone(440, 0.18, 'triangle', 0.07);
          playTone(660, 0.16, 'sine', 0.06);
          playTone(880, 0.18, 'triangle', 0.06);
          vibrate([80, 30, 140]);
        }
      } else if (win) {
        updateFireworks(dt);
        updateHud();
      }
    }

    function roundedRectPath(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawTable() {
      const table = getTableRect();
      const radius = 28;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      roundedRectPath(table.x + 14, table.y + table.height * 0.08, table.width, table.height, radius + 12);
      ctx.fill();

      const surface = ctx.createLinearGradient(0, table.y, 0, table.y + table.height);
      surface.addColorStop(0, '#2f5d49');
      surface.addColorStop(0.22, '#214d3b');
      surface.addColorStop(0.52, '#183c2f');
      surface.addColorStop(1, '#102d24');
      ctx.fillStyle = surface;
      roundedRectPath(table.x, table.y, table.width, table.height, radius);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 3;
      roundedRectPath(table.x, table.y, table.width, table.height, radius);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      roundedRectPath(table.x + 18, table.y + 12, table.width - 36, table.height * 0.18, radius - 8);
      ctx.fill();

      const shine = ctx.createLinearGradient(table.x, table.y, table.x + table.width, table.y + table.height);
      shine.addColorStop(0, 'rgba(255,255,255,0.22)');
      shine.addColorStop(0.18, 'rgba(255,255,255,0.04)');
      shine.addColorStop(0.5, 'rgba(255,255,255,0)');
      shine.addColorStop(1, 'rgba(0,0,0,0.12)');
      ctx.fillStyle = shine;
      roundedRectPath(table.x, table.y, table.width, table.height, radius);
      ctx.fill();
    }

    function drawDip(dip) {
      const visualRadius = dip.radius * 0.84;

      ctx.beginPath();
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.ellipse(dip.x, dip.y + visualRadius * 0.78, visualRadius * 0.92, visualRadius * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.arc(dip.x, dip.y, visualRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.arc(dip.x, dip.y, visualRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.arc(dip.x + visualRadius * 0.18, dip.y - visualRadius * 0.12, visualRadius * 0.52, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall(ball) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.ellipse(ball.x, ball.y + ball.radius * 1.2, ball.radius * 0.9, ball.radius * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(
        ball.x - ball.radius * 0.48,
        ball.y - ball.radius * 0.48,
        ball.radius * 0.18,
        ball.x,
        ball.y,
        ball.radius
      );

      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.20, '#edf4ff');
      grad.addColorStop(0.42, ball.color);
      grad.addColorStop(0.72, '#a3b2c0');
      grad.addColorStop(1, '#75859a');

      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.arc(ball.x - ball.radius * 0.28, ball.y - ball.radius * 0.28, ball.radius * 0.28, 0, Math.PI * 2);
      ctx.fill();

      if (ball.captured) {
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.78)';
        ctx.arc(ball.x, ball.y, ball.radius + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawFireworks() {
      fireworksCtx.clearRect(0, 0, w, h);
      for (const f of fireworks) {
        const alpha = Math.max(0, 1 - f.age / f.life);
        fireworksCtx.save();
        fireworksCtx.globalAlpha = alpha * 0.9;
        fireworksCtx.fillStyle = f.color;
        fireworksCtx.beginPath();
        fireworksCtx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        fireworksCtx.fill();
        fireworksCtx.restore();
      }
    }

    function render() {
      ctx.clearRect(0, 0, w, h);

      const table = getTableRect();
      const cx = table.x + table.width / 2;
      const cy = table.y + table.height / 2;
      const angle = isMobileDevice ? 0 : clamp(tiltX, -1.5, 1.5) * 0.15;
      const scaleY = isMobileDevice ? 1 : 1 + clamp(tiltY, -1.5, 1.5) * 0.04;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.scale(1, scaleY);
      ctx.translate(-cx, -cy);

      drawTable();

      for (const dip of dips) {
        drawDip(dip);
      }

      for (const ball of balls) {
        drawBall(ball);
      }
      ctx.restore();

      if (fireworks.length > 0) {
        drawFireworks();
      }
    }

    function animate(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.033);
      lastTs = ts;

      update(dt);
      render();
      requestAnimationFrame(animate);
    }

    function handleOrientation(event) {
      if (typeof event.gamma === 'number' && typeof event.beta === 'number') {
        tiltX = clamp(event.gamma / 28, -1.5, 1.5);
        tiltY = clamp(event.beta / 28, -1.5, 1.5);
      }
    }

    function updateKeyboardTilt() {
      if (motionReady) return;

      const left = !!keys.ArrowLeft || !!keys.KeyA;
      const right = !!keys.ArrowRight || !!keys.KeyD;
      const up = !!keys.ArrowUp || !!keys.KeyW;
      const down = !!keys.ArrowDown || !!keys.KeyS;

      const keyboardX = (right ? 1 : 0) - (left ? 1 : 0);
      const keyboardY = (down ? 1 : 0) - (up ? 1 : 0);

      keyboardTiltX = clamp(keyboardX, -1, 1);
      keyboardTiltY = clamp(keyboardY, -1, 1);
      tiltX = keyboardTiltX;
      tiltY = keyboardTiltY;
    }

    async function requestMotionPermission() {
      if (!motionSupported) {
        motionReady = false;
        return false;
      }

      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            motionReady = false;
            return false;
          }
        }
        motionReady = true;
        window.addEventListener('deviceorientation', handleOrientation, true);
        return true;
      } catch (err) {
        console.warn('Motion permission failed:', err);
        motionReady = false;
        return false;
      }
    }

    async function startGame() {
      ensureAudio();
      motionReady = motionSupported ? await requestMotionPermission() : false;
      if (!motionReady) {
        tiltX = 0;
        tiltY = 0;
        keyboardTiltX = 0;
        keyboardTiltY = 0;
      }
      resetGame();
      running = true;
      startOverlay.style.display = 'none';
      quitButton.hidden = false;
      winOverlay.classList.remove('visible');
      updateHud();
    }

    function returnToMenu() {
      running = false;
      Object.keys(keys).forEach((key) => {
        keys[key] = false;
      });
      keyboardTiltX = 0;
      keyboardTiltY = 0;
      tiltX = 0;
      tiltY = 0;
      resetGame();
      fireworks = [];
      startOverlay.style.display = '';
      quitButton.hidden = true;
      winOverlay.classList.remove('visible');
    }

    const keys = {};

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Escape' && (running || win)) {
        event.preventDefault();
        returnToMenu();
        return;
      }
      keys[event.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(event.code)) {
        event.preventDefault();
      }
      if (!motionReady) {
        updateKeyboardTilt();
      }
    });

    window.addEventListener('keyup', (event) => {
      keys[event.code] = false;
      if (!motionReady) {
        updateKeyboardTilt();
      }
    });

    window.addEventListener('blur', () => {
      Object.keys(keys).forEach((key) => {
        keys[key] = false;
      });
      keyboardTiltX = 0;
      keyboardTiltY = 0;
      tiltX = 0;
      tiltY = 0;
    });

    startButton.addEventListener('click', startGame);
    quitButton.addEventListener('click', returnToMenu);
    penaltiesEnabled.addEventListener('change', () => {
      penaltyType.disabled = !penaltiesEnabled.checked;
    });
    showLeaderboardButton.addEventListener('click', () => {
      startMenuContent.hidden = true;
      menuLeaderboardView.hidden = false;
      renderLeaderboard();
    });
    leaderboardBackButton.addEventListener('click', () => {
      menuLeaderboardView.hidden = true;
      startMenuContent.hidden = false;
    });
    randomizeButton.addEventListener('click', () => {
      randomizeSettings();
      startGame();
    });
    restartButton.addEventListener('click', startGame);
    menuButton.addEventListener('click', returnToMenu);
    sizeSlider.addEventListener('input', () => {
      updateSizeLabel();
      renderLeaderboard();
    });
    countSlider.addEventListener('input', () => {
      updateCountLabel();
      renderLeaderboard();
    });
    window.addEventListener('resize', resize);

    resize();
    updateSizeLabel();
    updateCountLabel();
    renderLeaderboard();
    resetGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
