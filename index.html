<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Gyro Ballz</title>
  <style>
    :root {
      --bg-1: #090d12;
      --bg-2: #111827;
      --panel: rgba(255,255,255,0.06);
      --panel-border: rgba(255,255,255,0.12);
      --silver-1: #f4f8ff;
      --silver-2: #dfe7f1;
      --silver-3: #a8b7c9;
      --silver-4: #7a8798;
      --dip: rgba(255,255,255,0.05);
      --dip-ring: rgba(255,255,255,0.16);
      --text: rgba(255,255,255,0.9);
      --subtle: rgba(255,255,255,0.74);
      --shadow: rgba(0,0,0,0.4);
      --success: #d9f9e3;
      --success-strong: #8ef0b2;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,0.08), transparent 20%),
                  radial-gradient(circle at 80% 75%, rgba(255,255,255,0.05), transparent 20%),
                  linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    #fireworksCanvas {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 170px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 10px 28px rgba(0,0,0,0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      letter-spacing: 0.08em;
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 700;
      text-transform: uppercase;
    }

    .hud-item {
      display: inline-block;
      min-width: 70px;
      text-align: center;
    }

    .hud-divider {
      opacity: 0.5;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 12, 0.48);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .panel {
      width: min(88vw, 540px);
      padding: 28px 22px 20px;
      border-radius: 28px;
      background: rgba(15, 19, 25, 0.82);
      border: 1px solid var(--panel-border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.42);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 10px 0 14px;
      color: var(--subtle);
      line-height: 1.5;
      font-size: clamp(14px, 2vw, 18px);
    }

    .rows {
      display: grid;
      gap: 14px;
      margin: 16px 0 22px;
      text-align: left;
    }

    .setting {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
    }

    .value {
      font-weight: 800;
      color: white;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #dfeaf8;
    }

    select {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(12,16,20,0.9);
      color: white;
      padding: 10px 12px;
      font-size: 16px;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 24px;
      color: #111827;
      background: linear-gradient(180deg, #f3f7ff, #dce9ff);
      box-shadow: 0 12px 26px rgba(255,255,255,0.18);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 800;
      font-size: clamp(13px, 2vw, 18px);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 8px 18px rgba(255,255,255,0.1);
    }

    #winOverlay {
      display: none;
    }

    #winOverlay.visible {
      display: flex;
    }

    .win-box {
      width: min(74vw, 420px);
      padding: 28px 22px 20px;
      border-radius: 28px;
      background: rgba(15, 19, 25, 0.88);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 22px 54px rgba(0,0,0,0.45);
      text-align: center;
    }

    .win-box h2 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .win-box p {
      margin: 0 0 18px;
      font-size: clamp(15px, 2vw, 20px);
    }

    .timer {
      margin: 10px 0 20px;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.08em;
      color: #dfeaf8;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <span id="scoreText" class="hud-item">0 / 5</span>
      <span class="hud-divider">|</span>
      <span id="timerText" class="hud-item">0.000s</span>
    </div>

    <canvas id="canvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div id="startOverlay" class="overlay">
      <div class="panel">
        <h1>Gyro Ballz</h1>
        <div class="rows">
          <div class="setting">
            <div class="label-row">
              <span>Difficulty</span>
              <span id="sizeValue" class="value">Normal</span>
            </div>
            <input id="sizeSlider" type="range" min="0.7" max="1.6" step="0.05" value="1.0" />
          </div>

          <div class="setting">
            <div class="label-row">
              <span>Balls</span>
              <span class="value"><select id="ballCountSelect">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select></span>
            </div>
          </div>

          <div class="setting">
            <div class="label-row">
              <span>Dips</span>
              <span class="value"><select id="dipCountSelect">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select></span>
            </div>
          </div>
        </div>

        <p class="notice">Any dip works. One ball can only sit in each dip at a time.</p>
        <button id="startButton">Start Game</button>
      </div>
    </div>

    <div id="winOverlay" class="overlay">
      <div class="win-box">
        <h2>You Win!</h2>
        <p>All balls are in their dips.</p>
        <div class="timer" id="timerDisplay">0.000s</div>
        <button id="restartButton">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fireworksCanvas = document.getElementById('fireworksCanvas');
    const fireworksCtx = fireworksCanvas.getContext('2d');
    const hud = document.getElementById('hud');
    const scoreText = document.getElementById('scoreText');
    const timerText = document.getElementById('timerText');
    const startOverlay = document.getElementById('startOverlay');
    const winOverlay = document.getElementById('winOverlay');
    const startButton = document.getElementById('startButton');
    const restartButton = document.getElementById('restartButton');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const ballCountSelect = document.getElementById('ballCountSelect');
    const dipCountSelect = document.getElementById('dipCountSelect');
    const timerDisplay = document.getElementById('timerDisplay');

    let BALL_COUNT = 5;
    let DIP_COUNT = 5;
    let sizeScale = 1;
    const gravity = 420;

    let w = 0;
    let h = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    let tiltX = 0;
    let tiltY = 0;
    let motionReady = false;
    let running = false;
    let win = false;
    let lastTs = 0;
    let audioCtx = null;
    let gameStartTime = 0;
    let winTime = 0;

    let dips = [];
    let balls = [];
    let fireworks = [];

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      fireworksCanvas.width = Math.floor(w * dpr);
      fireworksCanvas.height = Math.floor(h * dpr);
      fireworksCanvas.style.width = w + 'px';
      fireworksCanvas.style.height = h + 'px';
      fireworksCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function updateSizeLabel() {
      const val = Number(sizeSlider.value);
      if (val < 0.9) sizeValue.textContent = 'Small';
      else if (val > 1.1) sizeValue.textContent = 'Large';
      else sizeValue.textContent = 'Normal';
      sizeScale = val;
    }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainValue = 0.05) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = gainValue;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      const stopAt = audioCtx.currentTime + duration;
      gain.gain.exponentialRampToValueAtTime(0.0001, stopAt);
      osc.stop(stopAt);
    }

    function vibrate(ms) {
      if ('vibrate' in navigator) {
        navigator.vibrate(ms);
      }
    }

    function updateHud() {
      const secured = balls.filter(b => b.captured).length;
      scoreText.textContent = secured + ' / ' + BALL_COUNT;
      const totalSeconds = running || win ? (Date.now() - gameStartTime) / 1000 : 0;
      timerText.textContent = totalSeconds.toFixed(3) + 's';
    }

    function createDip(x, y, radius) {
      return { x, y, radius, glow: 0, occupiedBy: null };
    }

    function generateDips() {
      const safeMargin = 52;
      const minDist = 110;
      const result = [];

      for (let i = 0; i < DIP_COUNT; i++) {
        let placed = false;
        for (let tries = 0; tries < 3000; tries++) {
          const radius = randomBetween(32, 52) * sizeScale;
          const x = randomBetween(safeMargin + radius, w - safeMargin - radius);
          const y = randomBetween(safeMargin + radius, h - safeMargin - radius);

          const overlaps = result.some(d => {
            const dist = Math.hypot(d.x - x, d.y - y);
            return dist < Math.max(minDist, d.radius + radius + 8);
          });

          if (!overlaps) {
            result.push(createDip(x, y, radius));
            placed = true;
            break;
          }
        }

        if (!placed) {
          const angle = (Math.PI * 2 * i) / Math.max(DIP_COUNT, 1);
          const orbit = Math.min(w, h) * 0.25;
          const x = w / 2 + Math.cos(angle) * orbit;
          const y = h / 2 + Math.sin(angle) * orbit * 0.8;
          result.push(createDip(x, y, 46 * sizeScale));
        }
      }

      return result;
    }

    function generateBalls() {
      const cx = w * 0.5;
      const cy = h * 0.5;
      const spread = Math.min(w, h) * 0.16;
      const radius = 18 * sizeScale;

      return Array.from({ length: BALL_COUNT }, (_, i) => {
        const angle = (Math.PI * 2 * i) / Math.max(BALL_COUNT, 1);
        const x = cx + (Math.random() - 0.5) * spread * 1.6 + Math.cos(angle) * spread * 0.6;
        const y = cy + (Math.random() - 0.5) * spread * 1.4 + Math.sin(angle) * spread * 0.6;

        return {
          x,
          y,
          vx: randomBetween(-120, 120),
          vy: randomBetween(-120, 120),
          radius,
          captured: false,
          capturedDip: null,
          glow: 0,
          color: i % 2 === 0 ? '#e7edf6' : '#c1ced9'
        };
      });
    }

    function resetGame() {
      BALL_COUNT = Number(ballCountSelect.value);
      DIP_COUNT = Number(dipCountSelect.value);
      sizeScale = Number(sizeSlider.value);
      updateSizeLabel();

      dips = generateDips();
      balls = generateBalls();
      fireworks = [];
      win = false;
      winOverlay.classList.remove('visible');
      lastTs = 0;
      gameStartTime = Date.now();
      winTime = 0;
      updateHud();
    }

    function releaseBall(ball) {
      if (ball.captured) {
        ball.captured = false;
        if (ball.capturedDip) {
          ball.capturedDip.occupiedBy = null;
        }
        ball.capturedDip = null;
        ball.vx = (Math.random() - 0.5) * 80;
        ball.vy = (Math.random() - 0.5) * 80;
      }
    }

    function spawnFireworks() {
      const centerX = w / 2;
      const centerY = h / 2;
      const burst = 48;
      
      for (let i = 0; i < burst; i++) {
        const angle = (Math.PI * 2 * i) / burst + (Math.random() - 0.5) * 0.3;
        const speed = randomBetween(120, 340);
        const colors = ['#ffff00', '#ff6b6b', '#4ecdc4', '#95e1d3', '#f38181', '#aa96da', '#fcbad3', '#ffffd2'];
        
        fireworks.push({
          x: centerX,
          y: centerY,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: randomBetween(1.2, 2.0),
          age: 0,
          size: randomBetween(3, 8),
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      
      playTone(540, 0.14, 'triangle', 0.05);
      playTone(860, 0.16, 'sine', 0.05);
    }

    function tryCapture(ball) {
      if (ball.captured) {
        return;
      }

      const dip = dips.find(d => {
        if (d.occupiedBy && d.occupiedBy !== ball) return false;
        const dx = ball.x - d.x;
        const dy = ball.y - d.y;
        const dist = Math.hypot(dx, dy);
        return dist < d.radius * 0.75;
      });

      if (!dip) return;

      const speed = Math.hypot(ball.vx, ball.vy);
      const force = Math.abs(tiltX) + Math.abs(tiltY);

      if (speed < 160 && force < 1.3) {
        ball.captured = true;
        ball.capturedDip = dip;
        dip.occupiedBy = ball;
        ball.x = dip.x;
        ball.y = dip.y;
        ball.vx = 0;
        ball.vy = 0;
        ball.glow = 1;
        playTone(220, 0.12, 'triangle', 0.05);
        playTone(400, 0.08, 'sine', 0.04);
        vibrate(55);
        updateHud();
      }
    }

    function updatePhysics(ball, dt) {
      if (ball.captured && ball.capturedDip) {
        const dip = ball.capturedDip;
        const dist = Math.hypot(ball.x - dip.x, ball.y - dip.y);
        const force = Math.abs(tiltX) + Math.abs(tiltY);
        const speed = Math.hypot(ball.vx, ball.vy);

        if (force > 1.6 || speed > 160 || dist > dip.radius * 0.82) {
          releaseBall(ball);
        } else {
          ball.x += (dip.x - ball.x) * 0.16;
          ball.y += (dip.y - ball.y) * 0.16;
          ball.vx *= 0.78;
          ball.vy *= 0.78;
          ball.glow *= 0.96;
          return;
        }
      }

      const gx = tiltX * gravity * dt;
      const gy = tiltY * gravity * dt;

      ball.vx += gx;
      ball.vy += gy;
      ball.vx *= 0.994;
      ball.vy *= 0.994;

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.x - ball.radius <= 0) {
        ball.x = ball.radius;
        ball.vx *= -0.7;
        vibrate(12);
      }
      if (ball.x + ball.radius >= w) {
        ball.x = w - ball.radius;
        ball.vx *= -0.7;
        vibrate(12);
      }
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -0.7;
        vibrate(12);
      }
      if (ball.y + ball.radius >= h) {
        ball.y = h - ball.radius;
        ball.vy *= -0.7;
        vibrate(12);
      }

      for (let i = 0; i < balls.length; i++) {
        const other = balls[i];
        if (other === ball) continue;

        const dx = other.x - ball.x;
        const dy = other.y - ball.y;
        const distSq = dx * dx + dy * dy;
        const minDist = ball.radius + other.radius + 2;

        if (distSq > 0 && distSq < minDist * minDist) {
          const dist = Math.sqrt(distSq) || 0.0001;
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = (minDist - dist) * 0.5;

          ball.x -= nx * overlap;
          ball.y -= ny * overlap;
          other.x += nx * overlap;
          other.y += ny * overlap;

          const rvx = other.vx - ball.vx;
          const rvy = other.vy - ball.vy;
          const velAlongNormal = rvx * nx + rvy * ny;

          if (velAlongNormal < 0) {
            const impulse = -velAlongNormal * 0.75;
            ball.vx -= impulse * nx;
            ball.vy -= impulse * ny;
            other.vx += impulse * nx;
            other.vy += impulse * ny;
          }

          if (ball.captured || other.captured) {
            releaseBall(ball);
            releaseBall(other);
          } else {
            vibrate(15);
          }
        }
      }

      ball.glow *= 0.97;
      tryCapture(ball);
    }

    function updateFireworks(dt) {
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.age += dt;
        f.x += f.dx * dt;
        f.y += f.dy * dt;
        f.dy += 140 * dt;
        if (f.age >= f.life) {
          fireworks.splice(i, 1);
        }
      }
    }

    function update(dt) {
      if (running) {
        for (const ball of balls) {
          updatePhysics(ball, dt);
        }
        updateHud();

        const secured = balls.filter(b => b.captured).length;
        if (secured >= BALL_COUNT && BALL_COUNT > 0) {
          win = true;
          running = false;
          winTime = (Date.now() - gameStartTime) / 1000;
          timerDisplay.textContent = winTime.toFixed(3) + 's';
          updateHud();
          spawnFireworks();
          winOverlay.classList.add('visible');
          playTone(440, 0.18, 'triangle', 0.07);
          playTone(660, 0.16, 'sine', 0.06);
          playTone(880, 0.18, 'triangle', 0.06);
          vibrate([80, 30, 140]);
        }
      } else if (win) {
        updateFireworks(dt);
        updateHud();
      }
    }

    function drawDip(dip) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.arc(dip.x, dip.y, dip.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.arc(dip.x, dip.y, dip.radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.arc(dip.x + dip.radius * 0.18, dip.y - dip.radius * 0.12, dip.radius * 0.52, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall(ball) {
      const grad = ctx.createRadialGradient(
        ball.x - ball.radius * 0.48,
        ball.y - ball.radius * 0.48,
        ball.radius * 0.18,
        ball.x,
        ball.y,
        ball.radius
      );

      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.20, '#edf4ff');
      grad.addColorStop(0.42, ball.color);
      grad.addColorStop(0.72, '#a3b2c0');
      grad.addColorStop(1, '#75859a');

      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.arc(ball.x - ball.radius * 0.28, ball.y - ball.radius * 0.28, ball.radius * 0.28, 0, Math.PI * 2);
      ctx.fill();

      if (ball.captured) {
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.78)';
        ctx.arc(ball.x, ball.y, ball.radius + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawFireworks() {
      fireworksCtx.clearRect(0, 0, w, h);
      for (const f of fireworks) {
        const alpha = Math.max(0, 1 - f.age / f.life);
        fireworksCtx.save();
        fireworksCtx.globalAlpha = alpha * 0.9;
        fireworksCtx.fillStyle = f.color;
        fireworksCtx.beginPath();
        fireworksCtx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        fireworksCtx.fill();
        fireworksCtx.restore();
      }
    }

    function render() {
      ctx.clearRect(0, 0, w, h);

      for (const dip of dips) {
        drawDip(dip);
      }

      for (const ball of balls) {
        drawBall(ball);
      }

      if (fireworks.length > 0) {
        drawFireworks();
      }
    }

    function animate(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.033);
      lastTs = ts;

      update(dt);
      render();
      requestAnimationFrame(animate);
    }

    function handleOrientation(event) {
      if (typeof event.gamma === 'number' && typeof event.beta === 'number') {
        tiltX = clamp(event.gamma / 28, -1.5, 1.5);
        tiltY = clamp(event.beta / 28, -1.5, 1.5);
      }
    }

    async function requestMotionPermission() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            return false;
          }
        }
        motionReady = true;
        window.addEventListener('deviceorientation', handleOrientation, true);
        return true;
      } catch (err) {
        console.warn('Motion permission failed:', err);
        return false;
      }
    }

    function pointerTilt(event) {
      if (motionReady) return;
      const x = (event.clientX / w) * 2 - 1;
      const y = (event.clientY / h) * 2 - 1;
      tiltX = clamp(x * 1.2, -1.5, 1.5);
      tiltY = clamp(y * 1.2, -1.5, 1.5);
    }

    function startGame() {
      ensureAudio();
      if (!motionReady) {
        requestMotionPermission();
      }
      resetGame();
      running = true;
      startOverlay.style.display = 'none';
      winOverlay.classList.remove('visible');
      updateHud();
    }

    startButton.addEventListener('click', startGame);
    restartButton.addEventListener('click', startGame);
    sizeSlider.addEventListener('input', updateSizeLabel);
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', pointerTilt, { passive: true });

    resize();
    updateSizeLabel();
    resetGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
